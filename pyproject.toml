[build-system]
requires = ["setuptools==65.5.1", "wheel==0.38.4"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-batch-renamer"
version = "0.3.2"
description = "面向离线 Windows 7 流水线的 Excel 批量文件整理工具"
requires-python = ">=3.8,<3.9"
dependencies = [
    "openpyxl==3.1.5",
    "reportlab==3.6.13",
    "Pillow==9.5.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
